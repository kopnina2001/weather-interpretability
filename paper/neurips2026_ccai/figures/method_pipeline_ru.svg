<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680">
  <defs>
    <marker id="arrow-slate" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#526979"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#C66C25"/></marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4E7B98"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#86508E"/></marker>
    <style>
      text { font-family: "Liberation Sans", Arial, sans-serif; fill: #172431; }
      .panel { stroke-width: 2.2; rx: 18; }
      .panel-blue { fill: #F3F7FA; stroke: #AFC5D4; }
      .panel-green { fill: #F2F8EF; stroke: #84B47D; }
      .panel-metric { fill: #F1F6F9; stroke: #7EA2B9; }
      .panel-purple { fill: #F8F3FA; stroke: #AD8ABC; }
      .step { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
      .step-number { font-size: 19px; font-weight: 700; fill: white; text-anchor: middle; dominant-baseline: middle; }
      .divider { stroke-width: 1.4; opacity: .72; }
      .node { fill: white; stroke: #526979; stroke-width: 2.1; rx: 13; }
      .patch-node { fill: #FCE3C3; stroke: #C66C25; stroke-width: 2.3; rx: 13; }
      .model-node { fill: #D9EAD3; stroke: #4A984E; stroke-width: 2.2; rx: 13; }
      .forecast-node { fill: #EADDF2; stroke: #87508F; stroke-width: 2.2; rx: 13; }
      .metric-node { fill: #E6EEF3; stroke: #4E7B98; stroke-width: 2.2; rx: 13; }
      .output-node { fill: #EADDF2; stroke: #86508E; stroke-width: 2.2; rx: 13; }
      .body { font-size: 22px; text-anchor: middle; }
      .small { font-size: 19px; text-anchor: middle; fill: #475966; }
      .label { font-size: 17px; font-weight: 700; letter-spacing: .6px; text-anchor: middle; }
      .symbol { font-size: 27px; font-style: italic; text-anchor: middle; }
      .edge-ref { fill: none; stroke: #526979; stroke-width: 2.5; marker-end: url(#arrow-slate); }
      .edge-patch { fill: none; stroke: #C66C25; stroke-width: 2.7; marker-end: url(#arrow-orange); }
      .edge-blue { fill: none; stroke: #4E7B98; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .edge-purple { fill: none; stroke: #86508E; stroke-width: 2.5; marker-end: url(#arrow-purple); }
      .shared { fill: none; stroke: #6BA56B; stroke-width: 2; stroke-dasharray: 7 6; }
      .junction { fill: white; stroke-width: 2.3; }
      .footer { fill: #FBFCFD; stroke: #CAD6DE; stroke-width: 1.8; rx: 12; }
      .footer-title { font-size: 18px; font-weight: 700; letter-spacing: .4px; }
      .footer-body { font-size: 20px; }
    </style>
  </defs>

  <rect class="panel panel-blue" x="18" y="25" width="350" height="520"/>
  <circle cx="49" cy="61" r="18" fill="#365A73"/><text class="step-number" x="49" y="62">1</text>
  <text class="step" x="79" y="68" fill="#365A73">ВХОДНАЯ ЗАМЕНА</text>
  <line class="divider" x1="38" y1="87" x2="348" y2="87" stroke="#AFC5D4"/>

  <rect class="panel panel-green" x="386" y="25" width="360" height="520"/>
  <circle cx="417" cy="61" r="18" fill="#397D3E"/><text class="step-number" x="417" y="62">2</text>
  <text class="step" x="447" y="68" fill="#28752E">ПАРНЫЕ ПРОГОНЫ</text>
  <line class="divider" x1="406" y1="87" x2="726" y2="87" stroke="#84B47D"/>

  <rect class="panel panel-metric" x="764" y="25" width="350" height="520"/>
  <circle cx="795" cy="61" r="18" fill="#4E7B98"/><text class="step-number" x="795" y="62">3</text>
  <text class="step" x="825" y="68" fill="#365A73">ДВА ПОКАЗАТЕЛЯ</text>
  <line class="divider" x1="784" y1="87" x2="1094" y2="87" stroke="#7EA2B9"/>

  <rect class="panel panel-purple" x="1132" y="25" width="350" height="520"/>
  <circle cx="1163" cy="61" r="18" fill="#86508E"/><text class="step-number" x="1163" y="62">4</text>
  <text class="step" x="1193" y="68" fill="#6A2874">АГРЕГАЦИЯ</text>
  <line class="divider" x1="1152" y1="87" x2="1462" y2="87" stroke="#AD8ABC"/>

  <text class="label" x="107" y="113" fill="#365A73">БАЗОВАЯ ВЕТВЬ</text>
  <rect class="node" x="38" y="127" width="138" height="80"/>
  <text class="body" x="107" y="151">состояние</text><text class="body" x="107" y="176">ERA5</text><text class="symbol" x="107" y="198">x(t)</text>
  <rect class="node" x="215" y="127" width="132" height="80"/>
  <text class="body" x="281" y="158">без замены</text><text class="symbol" x="281" y="190">x⁽⁰⁾ = x</text>

  <text class="label" x="107" y="303" fill="#A65D22">ИНТЕРВЕНЦИЯ</text>
  <rect class="node" x="38" y="317" width="138" height="84"/>
  <text class="body" x="107" y="344">климатология</text><text class="body" x="107" y="370">WB2</text><text class="small" x="107" y="393">тот же день и час</text>
  <rect class="patch-node" x="199" y="269" width="158" height="204"/>
  <text class="label" x="278" y="301" fill="#A65D22">ЗАМЕНА ПОЛЯ v</text>
  <text class="symbol" x="278" y="339">xᵥ⁽ᵅ⁾</text><text class="body" x="278" y="375">= (1−α)xᵥ + αcᵥ</text>
  <text class="small" x="278" y="410">α = 0, .2, …, 1</text><text class="small" x="278" y="434">прочие 18 полей</text><text class="small" x="278" y="456">фиксированы</text>
  <path class="edge-ref" d="M176 167 H215"/><path class="edge-patch" d="M176 359 H199"/><path class="edge-patch" d="M107 207 V239 H278 V269"/>

  <text class="label" x="566" y="113" fill="#397D3E">БАЗОВЫЙ</text>
  <rect class="model-node" x="410" y="127" width="138" height="80"/>
  <text class="symbol" x="479" y="158">fθ</text><text class="small" x="479" y="184">фиксированные</text><text class="small" x="479" y="204">веса</text>
  <rect class="forecast-node" x="585" y="127" width="137" height="80"/>
  <text class="symbol" x="653" y="160">ŷᵤ⁽⁰⁾</text><text class="small" x="653" y="190">+6 ч  /  +24 ч</text>

  <text class="label" x="566" y="303" fill="#397D3E">С ЗАМЕНОЙ</text>
  <rect class="model-node" x="410" y="319" width="138" height="80"/>
  <text class="symbol" x="479" y="352">fθ</text><text class="small" x="479" y="382">те же веса</text>
  <rect class="forecast-node" x="585" y="319" width="137" height="80"/>
  <text class="symbol" x="653" y="352">ŷᵤ⁽ᵛ,ᵅ⁾</text><text class="small" x="653" y="382">+6 ч  /  +24 ч</text>
  <path class="edge-ref" d="M347 167 H410"/><path class="edge-ref" d="M548 167 H585"/>
  <path class="edge-patch" d="M357 359 H410"/><path class="edge-patch" d="M548 359 H585"/>
  <path class="shared" d="M479 207 V319"/>
  <rect x="435" y="245" width="88" height="34" rx="17" fill="#F2F8EF" stroke="#84B47D" stroke-width="1.5"/>
  <text class="small" x="479" y="269">одна θ</text>
  <text class="small" x="566" y="475">те же дата и срок τ</text><text class="small" x="566" y="504">различается одно входное поле</text>

  <circle class="junction" cx="815" cy="263" r="34" stroke="#4E7B98"/><text class="label" x="815" y="270" fill="#365A73">ПАРА</text>
  <rect class="metric-node" x="870" y="117" width="220" height="112"/>
  <text class="symbol" x="980" y="153">Sᵥᵤ</text><text class="body" x="980" y="185">отклонение прогноза</text><text class="small" x="980" y="213">замена против базы</text>
  <rect class="metric-node" x="870" y="327" width="220" height="112"/>
  <text class="symbol" x="980" y="363">ΔACCᵥᵤ</text><text class="body" x="980" y="395">изменение качества</text><text class="small" x="980" y="423">по целевому ERA5</text>
  <path class="edge-ref" d="M722 167 H775 V246 H782"/><path class="edge-patch" d="M722 359 H775 V280 H782"/>
  <path class="edge-blue" d="M815 229 V173 H870"/><path class="edge-blue" d="M815 297 V383 H870"/>
  <text class="small" x="939" y="482">взвешивание по площади;</text><text class="small" x="939" y="511">для каждого входа v и выхода u</text>

  <circle class="junction" cx="1177" cy="263" r="32" stroke="#86508E"/><text class="label" x="1177" y="270" fill="#6A2874">СБОР</text>
  <rect class="output-node" x="1231" y="105" width="224" height="96"/>
  <text class="label" x="1343" y="132" fill="#6A2874">НАПРАВЛЕННЫЕ</text><text class="label" x="1343" y="155" fill="#6A2874">МАТРИЦЫ</text><text class="body" x="1343" y="187">19 входов × 19 выходов</text>
  <rect class="output-node" x="1231" y="225" width="224" height="96"/>
  <text class="label" x="1343" y="259" fill="#6A2874">ДОЗОВЫЙ ОТКЛИК</text><text class="body" x="1343" y="297">α = 0, .2, …, 1</text>
  <rect class="output-node" x="1231" y="345" width="224" height="96"/>
  <text class="label" x="1343" y="379" fill="#6A2874">ГЕОГРАФИЯ ОШИБКИ</text><text class="body" x="1343" y="407">карты + профили</text><text class="body" x="1343" y="432">широт</text>
  <path class="edge-blue" d="M1090 173 H1177 V231"/><path class="edge-blue" d="M1090 383 H1140 V263 H1145"/>
  <path class="edge-purple" d="M1209 263 H1219 V153 H1231"/><path class="edge-purple" d="M1209 263 H1231"/><path class="edge-purple" d="M1209 263 H1219 V393 H1231"/>
  <text class="small" x="1307" y="482">повторение по датам, срокам,</text><text class="small" x="1307" y="511">дозам, полям и узлам сетки</text>

  <rect class="footer" x="18" y="570" width="716" height="88"/>
  <text class="footer-title" x="40" y="601" fill="#365A73">ЧТО ВЫЯВЛЯЕТ АУДИТ</text>
  <text class="footer-body" x="40" y="635">Насколько ошибка поля v меняет поле u, на каком сроке и где.</text>
  <rect class="footer" x="752" y="570" width="730" height="88"/>
  <text class="footer-title" x="774" y="601" fill="#6A2874">ПРОВЕРЯЕМЫЕ ГИПОТЕЗЫ ДЛЯ ОБУЧЕНИЯ</text>
  <text class="footer-body" x="774" y="635">Веса полей и широт, проверяемые парным переобучением.</text>
</svg>
